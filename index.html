<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこログ管理 - みんなのネコマップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; }
        #map { flex: 1; height: 100%; z-index: 1; }
        #sidebar {
            width: 400px; height: 100%; background: #f4f4f4;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; z-index: 1000;
        }
        #sidebar-header {
            padding: 10px; background: #fff; border-bottom: 1px solid #ccc;
            display: flex; justify-content: space-between; align-items: center;
        }
        #project-selector {
            padding: 5px; border-radius: 4px; border: 1px solid #ccc;
        }
        #cat-table { flex: 1; }
        #loading {
            display: none; padding: 10px; text-align: center; 
            background: #fff3cd; color: #856404; font-size: 14px;
        }

        /* スマホ用レイアウト */
        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="map"></div>
    <div id="sidebar">
        <div id="sidebar-header">
            <strong>🐈 ねこログ</strong>
            <select id="project-selector">
                <option value="https://script.google.com/macros/s/AKfycbxxNvrgs0vTWNF5W8SWpSoaeFRFF5fK0iypGjDB427Y8e9SPZn84eqma7GV8mGOzHJSIA/exec">事業A（メイン）</option>
                <option value="https://script.google.com/macros/s/DUMMY_URL_FOR_PROJECT_B/exec">事業B（別シート）</option>
            </select>
        </div>
        <div id="loading">データを読み込み中...</div>
        <div id="cat-table"></div>
    </div>
</div>

<script>
    // 1. 地図の初期化 (ひとまず日本全体が見えるように設定)
    const map = L.map('map').setView([36.2048, 138.2529], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ピンを管理するためのグループ（事業切り替え時に一括削除するため）
    const markerGroup = L.layerGroup().addTo(map);
    let markers = {}; 

    // 2. 表の初期化（データは空の状態で枠だけ作る）
    const table = new Tabulator("#cat-table", {
        data: [],
        layout: "fitColumns",
        columns: [
            { title: "ID", field: "id", width: 50 },
            { title: "名前", field: "name" },
            { title: "毛色", field: "color" },
            { title: "発見日", field: "date" },
        ],
    });

    // 表の行をクリックしたときのアクション
    table.on("rowClick", function(e, row){
        const rowData = row.getData();
        const targetMarker = markers[rowData.id];

        if(targetMarker) {
            map.flyTo([rowData.lat, rowData.lng], 16, { animate: true, duration: 1.0 });
            targetMarker.openPopup();
        }
    });

    // 3. GASからデータを取得して画面を更新する関数
    async function loadData(url) {
        document.getElementById('loading').style.display = 'block'; // ローディング表示
        
        try {
            // GASからデータを取得
            const response = await fetch(url);
            const data = await response.json();

            // 古いピンをすべて削除
            markerGroup.clearLayers();
            markers = {};

            // 新しいデータでピンを立てる
            data.forEach(cat => {
                // lat(緯度)とlng(経度)が存在する場合のみピンを立てる
                if(cat.lat && cat.lng) {
                    const marker = L.marker([cat.lat, cat.lng]);
                    marker.bindPopup(`<b>${cat.name}</b><br>毛色: ${cat.color}<br>発見日: ${cat.date}`);
                    markerGroup.addLayer(marker);
                    markers[cat.id] = marker; // 行クリック用にIDで保存
                }
            });

            // 表のデータを更新
            table.setData(data);

            // 最初のピンの位置に地図を合わせる（データがあれば）
            if(data.length > 0 && data[0].lat && data[0].lng) {
                 map.setView([data[0].lat, data[0].lng], 12);
            }

        } catch (error) {
            console.error('データ取得エラー:', error);
            alert('データの読み込みに失敗しました。URLやGASの設定を確認してください。');
        } finally {
            document.getElementById('loading').style.display = 'none'; // ローディング非表示
        }
    }

    // 4. 事業切り替え（プルダウン変更）時のイベント
    const selector = document.getElementById('project-selector');
    selector.addEventListener('change', (e) => {
        loadData(e.target.value);
    });

    // 5. 画面読み込み時に、現在選択されている事業のデータを読み込む
    loadData(selector.value);
</script>

</body>
</html>
