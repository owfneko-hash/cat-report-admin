<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこログ管理 - みんなのネコマップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            overflow: hidden;
        }
        /* 全体のレイアウト（PC用ベース） */
        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        /* 左側の地図エリア */
        #map {
            flex: 1; /* 残りのスペースをすべて使う */
            height: 100%;
        }
        /* 右側のスプレッドシートエリア */
        #sidebar {
            width: 400px;
            height: 100%;
            background: #f4f4f4;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        #sidebar-header {
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #cat-table {
            flex: 1;
        }

        /* スマホ用レイアウト（画面幅が768px以下の場合） */
        @media (max-width: 768px) {
            #app {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                height: 40vh; /* スマホでは画面下部40%を表にする */
                box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="map"></div>
    <div id="sidebar">
        <div id="sidebar-header">
            <strong>🐈 ねこログ データシート</strong>
        </div>
        <div id="cat-table"></div>
    </div>
</div>

<script>
    // 1. ダミーデータの準備（実際はGoogleスプレッドシートなどから取得します）
    const catData = [
        { id: 1, name: "シロ", color: "白", date: "2026-09-01", lat: 35.6812, lng: 139.7671 },
        { id: 2, name: "クロ", color: "黒", date: "2026-09-03", lat: 35.6852, lng: 139.7528 },
        { id: 3, name: "ミケ", color: "三毛", date: "2026-09-07", lat: 35.6762, lng: 139.7611 }
    ];

    // 2. 地図の初期化 (東京駅周辺を中心に設定)
    const map = L.map('map').setView([35.6812, 139.7671], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ピン（マーカー）を保存しておくためのオブジェクト
    const markers = {};

    // 地図上にピンを立てる
    catData.forEach(cat => {
        const marker = L.marker([cat.lat, cat.lng]).addTo(map);
        marker.bindPopup(`<b>${cat.name}</b><br>毛色: ${cat.color}<br>発見日: ${cat.date}`);
        markers[cat.id] = marker; // IDをキーにしてマーカーを保存
    });

    // 3. 表（スプレッドシート風）の初期化
    const table = new Tabulator("#cat-table", {
        data: catData, // データを読み込み
        layout: "fitColumns", // 列幅を自動調整
        columns: [
            { title: "ID", field: "id", width: 50 },
            { title: "名前", field: "name" },
            { title: "毛色", field: "color" },
            { title: "発見日", field: "date" },
        ],
    });

    // 4. 表の行をクリックしたときの連動アクション
    table.on("rowClick", function(e, row){
        const rowData = row.getData();
        const targetMarker = markers[rowData.id];

        if(targetMarker) {
            // 地図をクリックしたピンの位置へスムーズに移動し、少しズーム
            map.flyTo([rowData.lat, rowData.lng], 16, { animate: true, duration: 1.0 });
            // ピンの吹き出し（ポップアップ）を開く
            targetMarker.openPopup();
        }
    });
</script>

</body>
</html>
