<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこログ管理 - みんなのネコマップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        
        /* 地図は全画面表示 */
        #map { width: 100vw; height: 100vh; z-index: 1; }
        
        /* サイドバー（PC用：右側に固定・スライド可能） */
        #sidebar {
            position: absolute; top: 0; right: 0; width: 600px;
            height: 100vh; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; z-index: 1000;
            transition: transform 0.3s ease;
        }
        #sidebar.hidden { transform: translateX(100%); }

        /* サイドバー開閉ボタン */
        #toggle-btn {
            position: absolute; top: 15px; right: 615px; z-index: 1001;
            padding: 10px 15px; background: #fff; border: 2px solid #ccc;
            border-radius: 5px; cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: right 0.3s ease;
        }
        #sidebar.hidden ~ #toggle-btn { right: 15px; }

        #sidebar-header {
            padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ccc;
            display: flex; justify-content: space-between; align-items: center;
        }
        #project-selector { padding: 5px; border-radius: 4px; border: 1px solid #ccc; max-width: 300px; }
        #cat-table { flex: 1; font-size: 13px; }
        
        #loading {
            display: none; padding: 10px; text-align: center; 
            background: #fff3cd; color: #856404; font-size: 14px;
        }

        .popup-img { max-width: 150px; height: auto; margin-top: 8px; border-radius: 4px; }

        /* スマホ用レイアウト（画面幅768px以下の場合：下部にスライド配置） */
        @media (max-width: 768px) {
            #sidebar {
                top: auto; bottom: 0; right: 0; width: 100vw; height: 50vh;
            }
            #sidebar.hidden { transform: translateY(100%); }
            #toggle-btn { top: auto; bottom: 52vh; right: 10px; transition: bottom 0.3s ease; }
            #sidebar.hidden ~ #toggle-btn { bottom: 10px; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="sidebar">
    <div id="sidebar-header">
        <strong>🐈 データシート</strong>
        <select id="project-selector">
            <option value="https://script.google.com/macros/s/AKfycbxxNvrgs0vTWNF5W8SWpSoaeFRFF5fK0iypGjDB427Y8e9SPZn84eqma7GV8mGOzHJSIA/exec">読み込み中...</option>
            <option value="https://script.google.com/macros/s/AKfycbzrGvMMEtmnZbL3cAdAq56MKoxmzE6W97kRAAGNtcgManeT2-231kqK7lVRrxI8j88/exec">読み込み中...</option>
        </select>
    </div>
    <div id="loading">データを読み込み中...</div>
    <div id="cat-table"></div>
</div>
<button id="toggle-btn">▶ 閉じる</button>

<script>
    // 1. 地図の初期化
    const map = L.map('map').setView([36.2048, 138.2529], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markerGroup = L.featureGroup().addTo(map);
    let markers = {}; 

    // ▼ ネコ用カスタムアイコンの設定 ▼
    const nekoIcon = L.icon({
        iconUrl: 'icon-neko.png',
        iconSize: [40, 40],       // アイコンのサイズ [幅, 高さ]
        iconAnchor: [20, 40],     // 画像中央下を緯度経度の起点にする [幅の半分, 高さ]
        popupAnchor: [0, -40]     // 吹き出しが表示される位置
    });

    // 2. 表の初期化（スプレッドシートと全く同じ12列）
    const table = new Tabulator("#cat-table", {
        data: [],
        layout: "fitColumns",
        columns: [
            { title: "ID", field: "id", width: 60 },
            { title: "送信日時", field: "timestamp", width: 100 },
            { title: "名前", field: "nickname", width: 80 },
            { title: "緯度", field: "lat", width: 80 },
            { title: "経度", field: "lng", width: 80 },
            { title: "目撃日時", field: "datetime", width: 100 },
            { title: "頭数", field: "catCount", width: 60 },
            { title: "耳カット", field: "earCut", width: 70 },
            { title: "柄", field: "pattern", width: 80 },
            { title: "備考", field: "remarks", width: 120 },
            { title: "写真", field: "photoUrl", width: 60, formatter: (cell) => {
                const url = cell.getValue();
                return url ? `<a href="${url}" target="_blank">🖼️</a>` : "";
            }},
            { title: "裏ID", field: "internalId", width: 80 }
        ],
    });

    // 表の行をクリックした時：地図がピンの位置へ飛んで吹き出しを開く
    table.on("rowClick", function(e, row){
        const rowData = row.getData();
        const targetMarker = markers[rowData.id];
        if(targetMarker) {
            map.flyTo([rowData.lat, rowData.lng], 17, { animate: true, duration: 1.0 });
            targetMarker.openPopup();
        }
    });

    // 3. データの取得と処理関数
    async function loadData(url) {
        document.getElementById('loading').style.display = 'block';
        
        try {
            // URLに ?mode=admin を自動付与して管理アプリモードで通信する（既存アプリへの干渉を防止）
            const requestUrl = url.includes('?') ? `${url}&mode=admin` : `${url}?mode=admin`;
            const response = await fetch(requestUrl);
            const json = await response.json();
            
            // GASから受け取った「シート名」と「データ」
            const sheetName = json.sheetName;
            const data = json.data;

            // プルダウンの表示名をスプレッドシート名に自動変更
            const selector = document.getElementById('project-selector');
            const selectedOption = selector.options[selector.selectedIndex];
            selectedOption.text = sheetName;

            markerGroup.clearLayers();
            markers = {};

            // 地図上にピンを立てる
            data.forEach(cat => {
                if(cat.lat && cat.lng) {
                    const marker = L.marker([cat.lat, cat.lng], { icon: nekoIcon });
                    
                    let popupHtml = `<b>${cat.nickname || '名無し'}</b><br>`;
                    popupHtml += `日時: ${cat.datetime || '不明'}<br>`;
                    popupHtml += `柄: ${cat.pattern || '-'} / 頭数: ${cat.catCount || 0}<br>`;
                    popupHtml += `耳カット: ${cat.earCut || '不明'}<br>`;
                    if (cat.photoUrl) {
                        popupHtml += `<img src="${cat.photoUrl}" class="popup-img">`;
                    }
                    
                    marker.bindPopup(popupHtml);
                    markerGroup.addLayer(marker);
                    markers[cat.id] = marker;
                }
            });

            // 表にデータをセット
            table.setData(data);

            // すべてのピンが画面に収まるように自動移動・ズーム
            if(Object.keys(markers).length > 0) {
                map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
            }

        } catch (error) {
            console.error('データ取得エラー:', error);
            alert('データの読み込みに失敗しました。GAS側のデプロイ状況などを確認してください。');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // 4. イベントリスナーの設定
    const selector = document.getElementById('project-selector');
    selector.addEventListener('change', (e) => {
        loadData(e.target.value);
    });

    const toggleBtn = document.getElementById('toggle-btn');
    const sidebar = document.getElementById('sidebar');
    
    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
        if(sidebar.classList.contains('hidden')) {
            toggleBtn.textContent = "◀ 開く";
        } else {
            toggleBtn.textContent = "▶ 閉じる";
        }
    });

    // 初期データロード
    loadData(selector.value);
</script>

</body>
</html>
