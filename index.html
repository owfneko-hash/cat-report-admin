<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ねこログ管理 - みんなのネコマップ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; background: #e0f2f1; }
        
        #map { width: 100vw; height: 100vh; z-index: 1; }
        
        #sidebar {
            position: absolute; top: 0; right: 0; 
            width: 600px; height: 100vh; 
            background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; z-index: 1000;
            transition: transform 0.3s ease;
        }
        #sidebar.hidden { transform: translateX(100%); }

        #resizer { position: absolute; top: 0; left: 0; bottom: 0; width: 6px; background: #d3d3d3; cursor: ew-resize; z-index: 1010; }
        #resizer:hover { background: #999; }

        #toggle-btn {
            position: absolute; top: 15px; left: -90px; width: 85px; z-index: 1001;
            padding: 10px 0; text-align: center; background: #fff; border: 2px solid #ccc;
            border-radius: 5px 0 0 5px; border-right: none; cursor: pointer; font-weight: bold;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.1);
        }

        #sidebar-header { padding: 10px 10px 10px 20px; background: #f8f9fa; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .header-buttons { display: flex; align-items: center; gap: 5px; }
        .control-btn { padding: 6px 10px; font-size: 13px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #fff; font-weight: bold; }
        .control-btn:hover { background: #eee; }
        #project-selector { padding: 5px; border-radius: 4px; border: 1px solid #ccc; max-width: 180px; font-size: 12px;}
        #cat-table { flex: 1; font-size: 13px; margin-left: 6px; }
        
        .tabulator-row.tabulator-selected { background-color: #ffcc80 !important; }
        .tabulator-row.tabulator-selected:hover { background-color: #ffb74d !important; }

        #loading { display: none; padding: 10px; text-align: center; background: #fff3cd; color: #856404; font-size: 14px; }
        .popup-img { max-width: 150px; max-height: 150px; object-fit: contain; margin-top: 8px; border-radius: 4px; }
        .custom-div-icon { background: none; border: none; }

        /* モーダル関連 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-overlay.hidden { display: none; }
        .modal-content { background: #fff; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 12px; border: 4px solid #b3e5fc; padding: 20px 25px; box-sizing: border-box; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-close-btn { position: absolute; top: 10px; right: 10px; background: #fff; border: 2px solid #ccc; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .modal-close-btn:hover { background: #f4f4f4; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .modal-title { color: #ff7043; font-weight: bold; font-size: 16px; }
        .modal-clear-btn { background: #fff; color: #ff7043; border: 1px solid #ff7043; border-radius: 20px; padding: 4px 15px; font-size: 12px; font-weight: bold; cursor: pointer; margin-right: 35px; }
        .modal-clear-btn:hover { background: #fff3e0; }
        
        .modal-body label.section-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; margin: 15px 0 5px; color: #555; }
        .date-inputs { display: flex; gap: 10px; align-items: center; }
        .date-inputs input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .mini-clear-btn { padding: 4px 8px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f8f9fa; }
        .mini-clear-btn:hover { background: #e2e6ea; }

        /* ▼ カスタムプルダウン（アコーディオン式）のデザイン ▼ */
        .custom-select { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 5px; background: #fff; }
        .custom-select summary { padding: 10px; cursor: pointer; font-size: 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .custom-select summary::-webkit-details-marker { display: none; } /* Safari用矢印消し */
        .custom-select summary::after { content: "▼"; font-size: 10px; color: #888; }
        .custom-select[open] summary::after { content: "▲"; }
        .checkbox-group { border-top: 1px solid #ccc; padding: 10px; max-height: 150px; overflow-y: auto; background: #fafafa; display: flex; flex-wrap: wrap; gap: 10px; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; color: #333; margin: 0; }

        .modal-apply-btn { width: 100%; background: #ff7043; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .modal-apply-btn:hover { background: #f4511e; }

        @media (max-width: 768px) {
            #sidebar { top: auto; bottom: 0; right: 0; width: 100vw !important; height: 50vh; }
            #sidebar.hidden { transform: translateY(100%); }
            #resizer { top: 0; left: 0; width: 100%; height: 6px; cursor: ns-resize; }
            #cat-table { margin-left: 0; margin-top: 6px; }
            #toggle-btn { top: -45px; left: auto; right: 10px; width: auto; border-radius: 5px 5px 0 0; border: 2px solid #ccc; border-bottom: none; padding: 10px 15px; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="sidebar">
    <div id="resizer"></div>
    <button id="toggle-btn">▶ 閉じる</button>

    <div id="sidebar-header">
        <div class="header-buttons">
            <strong>🐈 データシート</strong>
            <button id="toggle-filter-btn" class="control-btn">🔍 詳細フィルター</button>
        </div>
        <select id="project-selector">
            <option value="https://script.google.com/macros/s/AKfycbxxNvrgs0vTWNF5W8SWpSoaeFRFF5fK0iypGjDB427Y8e9SPZn84eqma7GV8mGOzHJSIA/exec">読み込み中...</option>
            <option value="https://script.google.com/macros/s/AKfycbzrGvMMEtmnZbL3cAdAq56MKoxmzE6W97kRAAGNtcgManeT2-231kqK7lVRrxI8j88/exec">読み込み中...</option>
        </select>
    </div>

    <div id="loading">データを読み込み中...</div>
    <div id="cat-table"></div>
</div>

<div id="filter-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="document.getElementById('filter-modal').classList.add('hidden')">×</button>
        <div class="modal-header">
            <span class="modal-title">詳細フィルター</span>
            <button id="clear-filter-btn" class="modal-clear-btn">全て表示(全解除)</button>
        </div>
        <div class="modal-body">
            
            <label class="section-title">
                <span>📅 目撃期間</span>
                <button type="button" id="clear-date-btn" class="mini-clear-btn">期間のみ解除</button>
            </label>
            <div class="date-inputs">
                <input type="date" id="filter-date-start">
                <span>〜</span>
                <input type="date" id="filter-date-end">
            </div>

            <label class="section-title">🐾 頭数</label>
            <details class="custom-select">
                <summary>選択する</summary>
                <div id="filter-catCount" class="checkbox-group"></div>
            </details>
            
            <label class="section-title">✂️ 耳カット</label>
            <details class="custom-select">
                <summary>選択する</summary>
                <div id="filter-earCut" class="checkbox-group"></div>
            </details>
            
            <label class="section-title">👤 報告者名</label>
            <details class="custom-select">
                <summary>選択する</summary>
                <div id="filter-nickname" class="checkbox-group"></div>
            </details>
            
            <label class="section-title">🎨 柄</label>
            <details class="custom-select">
                <summary>選択する</summary>
                <div id="filter-pattern" class="checkbox-group"></div>
            </details>
            
        </div>
        <button id="apply-filter-btn" class="modal-apply-btn">適用する</button>
    </div>
</div>

<script>
    // 1. 地図の初期化
    const map = L.map('map').setView([36.2048, 138.2529], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markerGroup = L.featureGroup().addTo(map);
    let markers = {}; 

    const nekoIcon = L.divIcon({
        className: 'custom-div-icon',
        html: '<div style="position:relative;"><img src="icon-neko.png" style="width: 40px; height: auto; position: absolute; bottom: 0; left: -20px;"></div>',
        iconSize: [0, 0], 
        popupAnchor: [0, -40] 
    });

    // 2. 表の初期化
    const table = new Tabulator("#cat-table", {
        data: [],
        layout: "fitColumns",
        selectableRows: 1, 
        columns: [
            { title: "ID", field: "id", width: 60 },
            { title: "送信日時", field: "timestamp", width: 90 },
            { title: "名前", field: "nickname", width: 80 },
            { title: "目撃日時", field: "datetime", width: 90 },
            { title: "頭数", field: "catCount", width: 60 },
            { title: "耳カット", field: "earCut", width: 70 },
            { title: "柄", field: "pattern", width: 80 },
            { title: "備考", field: "remarks", width: 120 },
            { title: "写真", field: "photoUrl", width: 50, formatter: (cell) => {
                const url = cell.getValue();
                return url ? `<a href="${url}" target="_blank">🖼️</a>` : "";
            }}
        ],
    });

    table.on("rowClick", function(e, row){
        const rowData = row.getData();
        const targetMarker = markers[rowData.id];
        if(targetMarker) {
            map.panTo([rowData.lat, rowData.lng], { animate: true, duration: 0.5 });
            targetMarker.openPopup();
        }
    });

    function renderMarkers(dataArray) {
        markerGroup.clearLayers();
        markers = {};
        dataArray.forEach(cat => {
            if(cat.lat && cat.lng) {
                const marker = L.marker([cat.lat, cat.lng], { icon: nekoIcon });
                let popupHtml = `<b>${cat.nickname || '名無し'}</b><br>`;
                popupHtml += `日時: ${cat.datetime || '不明'}<br>`;
                popupHtml += `柄: ${cat.pattern || '-'} / 頭数: ${cat.catCount || 0}<br>`;
                popupHtml += `耳カット: ${cat.earCut || '不明'}<br>`;
                if (cat.photoUrl) {
                    popupHtml += `<img src="${cat.photoUrl}" class="popup-img">`;
                }
                marker.bindPopup(popupHtml);
                markerGroup.addLayer(marker);
                markers[cat.id] = marker; 
                
                // ▼ ポップアップが開いた時に行を選択 ▼
                marker.on('popupopen', () => {
                    table.deselectRow(); 
                    table.selectRow(cat.id); 
                    table.scrollToRow(cat.id, "center", false).catch(err => {}); 
                });
                // ▼ ポップアップが閉じた時（選択解除）に行の色を消す ▼
                marker.on('popupclose', () => {
                    table.deselectRow();
                });
            }
        });
    }

    table.on("dataFiltered", function(filters, rows){
        const filteredData = rows.map(r => r.getData());
        renderMarkers(filteredData);
    });

    function updateFilterCheckboxes(data) {
        function populate(id, key) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            const uniqueValues = [...new Set(data.map(d => d[key]).filter(v => v !== "" && v !== null))].sort();
            uniqueValues.forEach(val => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = val;
                label.appendChild(cb);
                label.appendChild(document.createTextNode(val));
                container.appendChild(label);
            });
        }
        populate('filter-catCount', 'catCount');
        populate('filter-earCut', 'earCut');
        populate('filter-nickname', 'nickname');
        populate('filter-pattern', 'pattern');
    }

    // 3. データの取得
    async function loadData(url) {
        document.getElementById('loading').style.display = 'block';
        try {
            const requestUrl = url.includes('?') ? `${url}&mode=admin` : `${url}?mode=admin`;
            const response = await fetch(requestUrl);
            const json = await response.json();
            
            const selector = document.getElementById('project-selector');
            selector.options[selector.selectedIndex].text = json.sheetName;

            await table.setData(json.data);
            updateFilterCheckboxes(json.data);

            if(Object.keys(markers).length > 0) {
                map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
            }
        } catch (error) {
            console.error('データ取得エラー:', error);
            alert('データの読み込みに失敗しました。');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function complexFilter(data, filterParams) {
        if (filterParams.start || filterParams.end) {
            if (!data.datetime) return false;
            const rowTime = new Date(data.datetime).getTime();
            if (isNaN(rowTime)) return false; 
            const startTime = filterParams.start ? new Date(filterParams.start).setHours(0,0,0,0) : 0;
            const endTime = filterParams.end ? new Date(filterParams.end).setHours(23,59,59,999) : Infinity;
            if (rowTime < startTime || rowTime > endTime) return false;
        }
        if (filterParams.catCounts.length > 0 && !filterParams.catCounts.includes(String(data.catCount))) return false;
        if (filterParams.earCuts.length > 0 && !filterParams.earCuts.includes(String(data.earCut))) return false;
        if (filterParams.nicknames.length > 0 && !filterParams.nicknames.includes(String(data.nickname))) return false;
        if (filterParams.patterns.length > 0 && !filterParams.patterns.includes(String(data.pattern))) return false;
        return true;
    }

    function getCheckedValues(containerId) {
        const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
        return Array.from(checkboxes).map(cb => cb.value);
    }

    // ▼ フィルターモーダルのボタンイベント ▼
    document.getElementById('toggle-filter-btn').addEventListener('click', () => {
        document.getElementById('filter-modal').classList.remove('hidden');
    });

    document.getElementById('apply-filter-btn').addEventListener('click', () => {
        const filterParams = {
            start: document.getElementById('filter-date-start').value,
            end: document.getElementById('filter-date-end').value,
            catCounts: getCheckedValues('filter-catCount'),
            earCuts: getCheckedValues('filter-earCut'),
            nicknames: getCheckedValues('filter-nickname'),
            patterns: getCheckedValues('filter-pattern')
        };
        table.clearFilter();
        table.addFilter(complexFilter, filterParams);
        document.getElementById('filter-modal').classList.add('hidden');
    });

    // 「全解除」ボタン
    document.getElementById('clear-filter-btn').addEventListener('click', () => {
        document.getElementById('filter-date-start').value = "";
        document.getElementById('filter-date-end').value = "";
        document.querySelectorAll('.checkbox-group input[type="checkbox"]').forEach(cb => cb.checked = false);
        table.clearFilter();
        document.getElementById('filter-modal').classList.add('hidden');
    });

    // 「期間のみ解除」ボタン
    document.getElementById('clear-date-btn').addEventListener('click', () => {
        document.getElementById('filter-date-start').value = "";
        document.getElementById('filter-date-end').value = "";
    });

    // リサイズと開閉イベント
    const resizer = document.getElementById('resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    const startResize = (e) => {
        isResizing = true;
        sidebar.style.transition = 'none';
        document.body.style.cursor = window.innerWidth <= 768 ? 'ns-resize' : 'ew-resize';
    };
    resizer.addEventListener('mousedown', startResize);
    resizer.addEventListener('touchstart', startResize, {passive: true});

    const handleResize = (e) => {
        if (!isResizing) return;
        let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

        if (window.innerWidth <= 768) {
            let newHeight = window.innerHeight - clientY;
            if(newHeight < 100) newHeight = 100;
            if(newHeight > window.innerHeight - 60) newHeight = window.innerHeight - 60;
            sidebar.style.height = newHeight + 'px';
        } else {
            let newWidth = window.innerWidth - clientX;
            if(newWidth < 300) newWidth = 300;
            if(newWidth > window.innerWidth - 100) newWidth = window.innerWidth - 100;
            sidebar.style.width = newWidth + 'px';
        }
    };
    document.addEventListener('mousemove', handleResize);
    document.addEventListener('touchmove', handleResize, {passive: true});

    const stopResize = () => {
        if (isResizing) {
            isResizing = false;
            document.body.style.cursor = 'default';
            sidebar.style.transition = 'transform 0.3s ease';
        }
    };
    document.addEventListener('mouseup', stopResize);
    document.addEventListener('touchend', stopResize);

    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
        if(sidebar.classList.contains('hidden')) {
            toggleBtn.textContent = window.innerWidth <= 768 ? "▲ 開く" : "◀ 開く";
        } else {
            toggleBtn.textContent = window.innerWidth <= 768 ? "▼ 閉じる" : "▶ 閉じる";
        }
    });

    const selector = document.getElementById('project-selector');
    selector.addEventListener('change', (e) => {
        loadData(e.target.value);
    });

    loadData(selector.value);
</script>

</body>
</html>
